<div class="taphint" id="taphint" data-page-node-id="yBg8OCkPxGFfZB4mVs0Vhv"><span id="tapTxt" data-page-node-id="DAYEYqO4PPfoRAj41NgN3H"></span><em data-page-node-id="Sqmii0VWw1C08NHDhK5B2Y">·</em><b data-page-node-id="GYJiDZaTrCINC1qCYM22U0">空格</b> 记录<em data-page-node-id="FBJjdreo2INn2b1jUUldY7">·</em><b data-page-node-id="uhQwrpM9BqGGEEYR7ZglqR">Esc</b> 结束</div>

<audio id="audio" src="assets/theme.mp3" preload="auto" data-page-node-id="nHkslRo1qhd6obhC3kzXCx"></audio>

<script>
(function(){
  /* 时间轴由合唱谱小节号推得：4/4，♩≈106，第1小节起于 1.16s */
  var L = [
    {t:0,      x:"♪ 前奏",                        m:1, s:"序曲"},
    {t:21.54,  x:"富德之声，书韵悠扬，",            s:"第一段"},
    {t:26.06,  x:"这里是我们成长的摇篮，"},
    {t:32.86,  x:"阳光乐学，敢于拼搏，"},
    {t:37.38,  x:"篮球跃动是我们童年的，"},
    {t:44.18,  x:"梦——"},
    {t:46.44,  x:"生命之花在这里生长，"},
    {t:50.97,  x:"玉兰树下，雅德美少年，"},
    {t:55.50,  x:"在知识的海洋里徜徉。"},
    {t:62.29,  x:"啊——",                          s:"副歌"},
    {t:64.55,  x:"追梦吧少年，"},
    {t:69.08,  x:"富满诗书启智慧，"},
    {t:73.61,  x:"书香学子"},
    {t:78.14,  x:"德行天下快乐长。"},
    {t:82.66,  x:"啊——"},
    {t:84.93,  x:"追梦吧少年，"},
    {t:87.19,  x:"富满诗书启智慧，"},
    {t:91.72,  x:"志存高远"},
    {t:96.25,  x:"德行天下圆梦想。"},
    {t:107.57, x:"♪ 间奏",                        m:1, s:"间奏"},
    {t:127.94, x:"雅德之声，师生修养，",            s:"第二段"},
    {t:132.47, x:"这里是我们美丽的校园，"},
    {t:139.27, x:"仁爱儒雅，"},
    {t:143.80, x:"共同成长，"},
    {t:146.06, x:"阅读知行坚定少年志。"},
    {t:152.84, x:"生命之花在这里绽放，"},
    {t:157.37, x:"文化石旁，雅德美少年，"},
    {t:161.90, x:"在智慧的殿堂里欢唱。"},
    {t:164.17, x:"欢唱。",                        s:"尾声"},
    {t:169.83, x:"啊，追梦吧少年，"},
    {t:175.49, x:"富满诗书启智慧，"},
    {t:182.28, x:"书香学子德行天下，"},
    {t:186.81, x:"快乐长。"},
    {t:188.51, x:"啊，追梦吧少年，"},
    {t:193.60, x:"富满诗书启智慧，"},
    {t:198.13, x:"志存高远"},
    {t:202.66, x:"德行天下圆梦想，"},
    {t:209.45, x:"德行天下圆梦想。"}
  ];

  var audio = document.getElementById('audio'),
      track = document.getElementById('track'),
      view  = document.getElementById('view'),
      secEl = document.getElementById('sec'),
      bar   = document.getElementById('bar'),
      fill  = document.getElementById('fill'),
      curEl = document.getElementById('cur'),
      durEl = document.getElementById('dur'),
      playB = document.getElementById('play'),
      ico   = document.getElementById('ico'),
      veil  = document.getElementById('veil'),
      offv  = document.getElementById('offv');

  var nodes = [], idx = -1, shift = 0, dragging = false, curSec = '';
  var T = L.map(function(o){ return o.t; });      /* 实际生效的时间轴 */
  var taps = {}, tapMode = false, tapIdx = 0;

  /* 生成歌词行 */
  L.forEach(function(item,i){
    var d = document.createElement('div');
    d.className = 'line' + (item.m ? ' music' : '');
    d.textContent = item.x;
    d.addEventListener('click', function(){
      if (tapMode){ tapIdx = i; updateTapHint(); return; }
      audio.currentTime = Math.max(0, T[i] - 0.05);
      if (audio.paused) play();
      paint(true);
    });
    track.appendChild(d);
    nodes.push(d);
  });

  function center(){
    if (idx < 0) return;
    var el = nodes[idx], H = view.clientHeight;
    var y = H/2 - (el.offsetTop + el.offsetHeight/2);
    track.style.transform = 'translateY(' + y.toFixed(1) + 'px)';
  }

  function section(){
    for (var i = idx; i >= 0; i--){
      if (L[i].s){ return L[i].s; }
    }
    return '';
  }

  function paint(force){
    var t = audio.currentTime;
    var lo = 0, hi = L.length - 1, r = 0;
    while (lo <= hi){
      var mid = (lo + hi) >> 1;
      if (T[mid] <= t){ r = mid; lo = mid + 1; } else { hi = mid - 1; }
    }
    if (r === idx && !force){ tick(); return; }
    idx = r;
    nodes.forEach(function(n,i){
      n.classList.toggle('on', i === idx);
      n.classList.toggle('near', Math.abs(i - idx) === 1);
    });
    center();
    var s = section();
    if (s !== curSec){
      curSec = s;
      if (s){
        secEl.textContent = s;
        secEl.classList.add('on');
      } else {
        secEl.classList.remove('on');
      }
    }
    tick();
  }

  function fmt(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec/60), s = Math.floor(sec%60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function tick(){
    var d = audio.duration || 229.3;
    var p = Math.min(1, Math.max(0, audio.currentTime / d));
    fill.style.width = (p*100).toFixed(3) + '%';
    curEl.textContent = fmt(audio.currentTime);
  }

  function setIcon(playing){
    ico.innerHTML = playing
      ? '<rect x="7" y="5" width="3.6" height="14" rx="1.4"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.4"/>'
      : '<path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.4-6.8c.6-.4.6-1.4 0-1.8L9.6 4.3C8.9 3.9 8 4.4 8 5.2z"/>';
    playB.setAttribute('aria-label', playing ? '暂停' : '播放');
  }

  function play(){
    if (audio.ended) audio.currentTime = 0;
    audio.play().then(function(){
      veil.classList.add('hide');
      setIcon(true);
    }).catch(function(){
      veil.classList.remove('hide');
      setIcon(false);
    });
  }
  function pause(){ audio.pause(); setIcon(false); }
  function toggle(){ audio.paused ? play() : pause(); }

  playB.addEventListener('click', toggle);
  veil.addEventListener('click', play);

  audio.addEventListener('loadedmetadata', function(){ durEl.textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', function(){ paint(false); });
  audio.addEventListener('play', function(){ setIcon(true); });
  audio.addEventListener('pause', function(){ setIcon(false); });
  audio.addEventListener('ended', function(){ setIcon(false); });
  audio.addEventListener('error', function(){
    veil.querySelector('.veil-t').textContent = '音频未能加载';
    veil.querySelector('.veil-h').textContent = '请确认 assets/theme.mp3 与网页在同一目录';
  });

  /* 进度条拖动 */
  function seekTo(clientX){
    var r = bar.getBoundingClientRect();
    var p = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    audio.currentTime = p * (audio.duration || 229.3);
    paint(true);
  }
  bar.addEventListener('pointerdown', function(e){
    dragging = true; bar.setPointerCapture(e.pointerId); seekTo(e.clientX);
  });
  bar.addEventListener('pointermove', function(e){ if (dragging) seekTo(e.clientX); });
  bar.addEventListener('pointerup', function(e){ dragging = false; });
  bar.addEventListener('pointercancel', function(){ dragging = false; });

  /* 键盘 */
  document.addEventListener('keydown', function(e){
    if (e.code === 'Space'){
      e.preventDefault();
      if (tapMode) recordTap(); else toggle();
    }
    else if (e.code === 'Escape'){ if (tapMode) exitTap(); }
    else if (e.code === 'ArrowRight'){ e.preventDefault(); audio.currentTime = Math.min(audio.duration||0, audio.currentTime + 5); }
    else if (e.code === 'ArrowLeft'){ e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - 5); }
  });

  /* ===== 校准 ===== */
  var tuneEl = document.getElementById('tune'),
      taphint = document.getElementById('taphint'),
      tapTxt = document.getElementById('tapTxt');

  function fmtOff(){
    offv.textContent = (shift > 0 ? '+' : shift < 0 ? '−' : '') + Math.abs(shift).toFixed(1) + 's';
  }
  function rebuild(){
    T = L.map(function(o,i){
      return taps[i] !== undefined ? taps[i] : Math.max(0, o.t + shift);
    });
  }
  function save(){
    if (Object.keys(taps).length) localStorage.setItem('ydzs-taps', JSON.stringify(taps));
    else localStorage.removeItem('ydzs-taps');
    localStorage.setItem('ydzs-shift', shift.toFixed(1));
    fmtOff(); rebuild(); paint(true);
  }
  function load(){
    var v = parseFloat(localStorage.getItem('ydzs-shift'));
    shift = isFinite(v) ? v : 0;
    try { taps = JSON.parse(localStorage.getItem('ydzs-taps') || '{}') || {}; } catch(err){ taps = {}; }
    fmtOff(); rebuild();
  }

  function updateTapHint(){
    if (!tapMode){ taphint.classList.remove('show'); return; }
    var n = Math.min(tapIdx, L.length - 1);
    tapTxt.textContent = (tapIdx >= L.length ? '已完成' : '第 ' + (n+1) + ' 句  ' + L[n].x);
    taphint.classList.add('show');
  }
  function recordTap(){
    if (tapIdx >= L.length){ exitTap(); return; }
    taps[tapIdx] = Math.round(audio.currentTime * 100) / 100;
    rebuild(); paint(true);
    tapIdx++;
    if (tapIdx >= L.length){ save(); updateTapHint(); setTimeout(exitTap, 900); }
    else { save(); updateTapHint(); }
  }
  function enterTap(){
    tapMode = true; tapIdx = idx < 0 ? 0 : idx;
    tuneEl.classList.remove('open');
    updateTapHint();
    audio.currentTime = Math.max(0, T[tapIdx] - 4);
    paint(true);
    if (audio.paused) play();
  }
  function exitTap(){
    tapMode = false;
    taphint.classList.remove('show');
    save();
  }

  document.getElementById('tuneBtn').addEventListener('click', function(e){
    e.stopPropagation();
    tuneEl.classList.toggle('open');
  });
  document.addEventListener('click', function(e){
    if (!tuneEl.contains(e.target)) tuneEl.classList.remove('open');
  });
  document.getElementById('early').addEventListener('click', function(e){
    e.stopPropagation(); shift = Math.min(6, +(shift + 0.1).toFixed(1)); save();
  });
  document.getElementById('late').addEventListener('click', function(e){
    e.stopPropagation(); shift = Math.max(-6, +(shift - 0.1).toFixed(1)); save();
  });
  document.getElementById('tapBtn').addEventListener('click', function(e){
    e.stopPropagation(); tapMode ? exitTap() : enterTap();
  });
  document.getElementById('resetBtn').addEventListener('click', function(e){
    e.stopPropagation(); taps = {}; shift = 0; save(); tuneEl.classList.remove('open');
  });
  load();

  /* 帧循环：拖动与高亮更顺滑 */
  (function loop(){
    if (!audio.paused || idx < 0) tick();
    if (!audio.paused || dragging) paint(false);
    requestAnimationFrame(loop);
  })();

  window.addEventListener('resize', center);
  window.addEventListener('orientationchange', function(){ setTimeout(center, 200); });

  /* 初始状态 */
  nodes[0].classList.add('on');
  idx = 0;
  requestAnimationFrame(function(){ center(); paint(true); });

  /* 尝试自动播放 */
  function tryAuto(){
    audio.play().then(function(){
      veil.classList.add('hide'); setIcon(true);
    }).catch(function(){
      setIcon(false);   /* 被拦截则保留遮罩，等一次点击 */
    });
  }
  if (audio.readyState >= 2) tryAuto();
  else audio.addEventListener('canplay', tryAuto, {once:true});
})();
</script>
